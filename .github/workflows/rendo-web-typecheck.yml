name: Rendo web TypeScript gate

on:
  pull_request:
    branches:
      - codex/github-handoff-2026-10-19
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/rendo-web-typecheck.yml'

permissions:
  contents: read

concurrency:
  group: web-typecheck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
      - name: Install web dependencies from lockfile
        run: pnpm install --frozen-lockfile --filter web...
      - name: Compile shared workspace types
        run: pnpm --filter @tfi/types build
      - name: Validate locale dictionaries
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const langs = ["es","en","pt"];
          const keys = ["verDetalleGrupo","detalleGrupoDescripcion","grupoDescripcion","grupoSinDescripcion","grupoSenaPredeterminada","grupoSinSena","grupoSenaNoDisponible","grupoSenaNoCobro"];
          for (const lang of langs) {
            const data = JSON.parse(fs.readFileSync(`apps/web/messages/${lang}.json`, "utf8"));
            for (const key of keys) if (typeof data.Inventario?.[key] !== "string" || !data.Inventario[key].trim()) throw new Error(`Missing ${lang}/Inventario/${key}`);
          }
          '
      - name: Web typecheck
        working-directory: apps/web
        run: node node_modules/typescript/bin/tsc --noEmit --pretty false
