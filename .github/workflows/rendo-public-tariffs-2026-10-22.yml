name: Rendo read-only public tariff duplicate diagnostic

on:
  push:
    branches:
      - qa/rendo-public-smoke-2026-10-22
    paths:
      - 'scripts/release/public-listing-tariff-diagnostic.mjs'
      - '.github/workflows/rendo-public-tariffs-2026-10-22.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Inspect only PUBLIC exact-title listing tariff fields; no credentials or writes
        run: node scripts/release/public-listing-tariff-diagnostic.mjs
