name: Rendo production web build gate

on:
  pull_request:
    branches:
      - codex/release-candidate-n01-n08-2026-10-20
      - codex/ui-playwright-matrix-2026-10-20
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/rendo-web-production-build.yml'

permissions:
  contents: read

concurrency:
  group: rendo-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  next-build:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: 'https://supabase.rendo.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'non-sensitive-local-build-placeholder'
      NEXT_PUBLIC_API_URL: 'https://api.rendo.invalid'
      API_URL: 'https://api.rendo.invalid'
      API_ORIGIN: 'https://api.rendo.invalid'
      WEB_PUBLIC_URL: 'https://web.rendo.invalid'
      RENDO_BETA_MODE: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
      - name: Install web dependencies from lockfile
        run: pnpm install --frozen-lockfile --filter web...
      - name: Build internal types
        run: pnpm --filter @tfi/types build
      - name: Next.js production build without hosted credentials
        working-directory: apps/web
        run: node node_modules/next/dist/bin/next build

  real-auth-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      AUTH_ALLOW_DEV_TOKENS: 'false'
      NEXT_PUBLIC_AUTH_ALLOW_DEV_TOKENS: 'false'
      NEXT_PUBLIC_RENDO_BETA_MODE: 'false'
      WEB_ORIGINS: 'http://localhost:3000'
      NEXT_PUBLIC_API_URL: 'http://127.0.0.1:3001'
      API_URL: 'http://127.0.0.1:3001'
      PORT: '3001'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile --filter api... --filter web...
      - name: Compile workspaces
        run: |
          pnpm --filter @tfi/types build
          pnpm --filter api build
      - name: Install Chromium
        working-directory: apps/web
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - name: Private loopback Docker bridge
        run: docker network create -o 'com.docker.network.bridge.host_binding_ipv4=127.0.0.1' rendo-real-auth-ci
      - name: Start local Supabase with no hosted credentials
        shell: bash
        run: |
          set -euo pipefail
          if ! supabase start --network-id rendo-real-auth-ci -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            echo 'Local Supabase startup failed (log not printed: might contain keys)'
            exit 1
          fi
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const s=JSON.parse(execFileSync('supabase',['status','-o','json'],{encoding:'utf8',stdio:['ignore','pipe','ignore']}));
          for(const [name,port] of [['API_URL',54321],['DB_URL',54322]]){
            const raw=s[name] ?? s[name.toLowerCase()];
            if(!raw) throw new Error('Missing local '+name);
            const u=new URL(raw);
            if(!['localhost','127.0.0.1'].includes(u.hostname)||Number(u.port)!==port) throw new Error('Non-loopback '+name);
          }
          const required=['API_URL','ANON_KEY','SERVICE_ROLE_KEY'];
          for(const key of required) if(!s[key]) throw new Error('Missing local status '+key);
          const map={
            SUPABASE_URL:s.API_URL,
            SUPABASE_INTERNAL_URL:s.API_URL,
            NEXT_PUBLIC_SUPABASE_URL:s.API_URL,
            SUPABASE_ANON_KEY:s.ANON_KEY,
            NEXT_PUBLIC_SUPABASE_ANON_KEY:s.ANON_KEY,
            SUPABASE_SERVICE_ROLE_KEY:s.SERVICE_ROLE_KEY,
          };
          for(const [name,value] of Object.entries(map)) {
            if(/\n|\r/.test(value)) throw new Error('Invalid env value');
            appendFileSync(process.env.GITHUB_ENV,`${name}=${value}\n`);
          }
          process.stdout.write('PASS: local-only API/DB preflight; environment values withheld\n');
          JS
      - name: Boot real local Nest API and Next web
        shell: bash
        run: |
          set -euo pipefail
          node apps/api/dist/main.js > "$RUNNER_TEMP/rendo-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/rendo-api.pid"
          (cd apps/web && node node_modules/next/dist/bin/next dev -p 3000 -H 127.0.0.1) > "$RUNNER_TEMP/rendo-web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/rendo-web.pid"
          api_ok=0
          for i in $(seq 1 75); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3001/health/ready >/dev/null; then api_ok=1; break; fi
            sleep 2
          done
          if [ "$api_ok" != 1 ]; then
            echo 'Local API failed readiness; sanitized recent errors:'
            grep -Ei 'error|exception|cannot|failed' "$RUNNER_TEMP/rendo-api.log" | tail -n 15 || true
            exit 1
          fi
          web_ok=0
          for i in $(seq 1 75); do
            if curl --silent --max-time 3 http://127.0.0.1:3000/es/auth/login >/dev/null; then web_ok=1; break; fi
            sleep 2
          done
          if [ "$web_ok" != 1 ]; then echo 'Local Next web not responding'; exit 1; fi
          echo 'PASS: real local API and Next web responding'
      - name: Verify test adapter disabled
        run: |
          test "$AUTH_ALLOW_DEV_TOKENS" = false
          test "$NEXT_PUBLIC_AUTH_ALLOW_DEV_TOKENS" = false
          test "$NEXT_PUBLIC_RENDO_BETA_MODE" = false
      - name: Playwright with genuine Supabase Auth and two managers
        working-directory: apps/web
        timeout-minutes: 7
        run: node node_modules/@playwright/test/cli.js test -c playwright.real-local.config.ts --grep 'Escenario 1: Aislamiento A/B' --reporter=list
      - name: Keep failure captures and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rendo-real-auth-local-browser-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            apps/web/test-results/
            specs/008-beta-observaciones-2026-10-02/evidence/N01/captures/
      - name: Stop only test-owned processes and local stack
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/rendo-web.pid" ]; then kill "$(cat "$RUNNER_TEMP/rendo-web.pid")" 2>/dev/null || true; fi
          if [ -f "$RUNNER_TEMP/rendo-api.pid" ]; then kill "$(cat "$RUNNER_TEMP/rendo-api.pid")" 2>/dev/null || true; fi
          supabase stop --no-backup >/dev/null 2>&1 || true
          docker network rm rendo-real-auth-ci >/dev/null 2>&1 || true
