name: Rendo N03 web save typecheck

on:
  pull_request:
    branches:
      - codex/github-handoff-2026-10-19
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/rendo-n03-web-unit.yml'

permissions:
  contents: read

concurrency:
  group: n03-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
      - name: Install web workspace dependencies
        run: pnpm install --frozen-lockfile --filter web...
      - name: Build shared types
        run: pnpm --filter @tfi/types build
      - name: Compile web without emitting
        working-directory: apps/web
        run: node node_modules/typescript/bin/tsc --noEmit --pretty false
