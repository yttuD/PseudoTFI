name: Rendo read-only web release diagnostics

on:
  pull_request:
    branches:
      - codex/release-candidate-n01-n08-2026-10-20
    paths:
      - 'scripts/db/readonly-release-audit.sql'
      - 'scripts/db/tests/readonly-release-audit.test.mjs'
      - '.github/workflows/rendo-readonly-release-audit.yml'

permissions:
  contents: read

jobs:
  audit-query-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify SQL is one aggregate-only read-only query
        run: node --test scripts/db/tests/readonly-release-audit.test.mjs
