name: Rendo N06 profile locale and TS

on:
  pull_request:
    branches:
      - codex/release-candidate-n01-n08-2026-10-20
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/rendo-profile-qa.yml'

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
      - name: Dependencies from lockfile
        run: pnpm install --frozen-lockfile --filter web...
      - name: Build shared workspace types
        run: pnpm --filter @tfi/types build
      - name: Check profile dictionary parity and placeholders
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const languages=["es","en","pt"];
          const all=languages.map(lang=>JSON.parse(fs.readFileSync(`apps/web/messages/${lang}.json`,"utf8")).Profile);
          const keys=Object.keys(all[0]).sort();
          for(let i=0;i<all.length;i++){
            if(JSON.stringify(Object.keys(all[i]).sort())!==JSON.stringify(keys)) throw new Error("Profile keys differ: "+languages[i]);
            for(const key of keys){
              if(typeof all[i][key]!=="string"||!all[i][key].trim()) throw new Error("Empty "+languages[i]+"/"+key);
              if(key==="betaQuota" && !all[i][key].includes("{count}")) throw new Error("Missing quota placeholder: "+languages[i]);
            }
          }
          '
      - name: TypeScript web
        working-directory: apps/web
        run: node node_modules/typescript/bin/tsc --noEmit --pretty false
